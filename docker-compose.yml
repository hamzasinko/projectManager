name: tarnished

networks:
  tarnished-metrologie:
    name: tarnished-metrologie

services:

  # ── Application ────────────────────────────────────────────────────────────
  app:
    build: .
    container_name: tarnished-app-1
    ports:
      - "8091:8080"
    networks:
      - tarnished-metrologie
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/gl2526-tarnished/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # ── Selenium Chrome (WebDriver distant) ────────────────────────────────────
  selenium:
    image: selenium/standalone-chrome:latest
    container_name: tarnished-selenium-1
    ports:
      - "4444:4444"
      - "7900:7900"        # noVNC pour observer le navigateur (optionnel)
    shm_size: "2g"
    networks:
      - tarnished-metrologie
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:4444/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # ── Tests Selenium (dans un conteneur) ─────────────────────────────────────
  tests:
    image: maven:3-eclipse-temurin-17-alpine
    container_name: tarnished-tests-1
    working_dir: /workspace/tarnished
    volumes:
      - ./tarnished:/workspace/tarnished
      - m2-cache:/root/.m2
    networks:
      - tarnished-metrologie
    depends_on:
      app:
        condition: service_healthy
      selenium:
        condition: service_healthy
    environment:
      - CI=true
    command: >
      mvn --batch-mode -pl project-app -am test
      -DforkCount=0
      -Dselenium.remote.browser=true
      -Dselenium.remote.url=http://selenium:4444/wd/hub
      -Dhost=app
      -Dservlet.port=8080

  # ── cAdvisor (métriques conteneurs) ────────────────────────────────────────
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: tarnished-cadvisor-1
    ports:
      - "8088:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /var/run:/var/run:ro     
      - /:/rootfs:ro  
    command:
      - "--docker_only=true"         
      - "--housekeeping_interval=5s" 
    privileged: true
    devices:
      - /dev/kmsg
    networks:
      - tarnished-metrologie
    restart: unless-stopped

  # ── Prometheus (collecte & stockage métriques) ──────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: tarnished-prometheus-1
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    networks:
      - tarnished-metrologie
    restart: unless-stopped
    depends_on:
      - cadvisor

  # ── Grafana (dashboards) ────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: tarnished-grafana-1
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - tarnished-metrologie
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
  m2-cache:
