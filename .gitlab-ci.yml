image: maven:3-eclipse-temurin-21-alpine

variables:
  MAVEN_CLI_OPTS: "--batch-mode -Dmaven.repo.local=libs"

cache:
  key: default-cache
  paths:
    - libs
    - "**/target"

stages:
  - build
  - unit-test
  - integration-test
  - test
  - deploy

# ============================
# 1️⃣ BUILD
# ============================
build:
  stage: build
  script:
    - cd tarnished
    - mvn clean install -DskipTests -DskipITs
  artifacts:
    paths:
      - project-app/target/*.war
      - project-model/target/*.jar
      - project-repomem/target/*.jar

# ============================
# 2️⃣ UNIT TESTS (Mockito)
# ============================
unit-test:
  stage: unit-test
  script:
    - cd tarnished
    - mvn test -pl project-model,project-repomem -am
  artifacts:
    reports:
      junit:
        - "**/target/surefire-reports/TEST-*.xml"

# ============================
# 3️⃣ INTEGRATION TESTS (Selenium)
# ============================
integration-test:
  stage: integration-test

  script:
    - cd tarnished
    - mvn $MAVEN_CLI_OPTS clean install -DskipTests

    # Lancer Jetty en arrière-plan (BLOQUANT normalement)
    - mvn $MAVEN_CLI_OPTS -pl project-app jetty:run -Djetty.host=0.0.0.0 -Djetty.port=8080 &

    # Attente ACTIVE jusqu'à ce que le serveur réponde
    - echo "⏳ Waiting for Jetty..."
    - for i in {1..30}; do curl -s http://localhost:8080 && break || sleep 2; done

    # Échec si toujours inaccessible
    - curl -f http://localhost:8080

    # Lancer les tests Selenium
    - mvn $MAVEN_CLI_OPTS verify


static-analysis:
  stage: test
  script:
    - mvn $MAVEN_CLI_OPTS install -DskipTests -Djacoco.skip=true spotbugs:spotbugs
  artifacts:
    paths:
      - "**/target/spotbugsXml.xml"

# ============================
# 4️⃣ DEPLOY (Docker via Kaniko)
# ============================
deploy-docker:
  stage: deploy
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  needs:
    - job: integration-test
      artifacts: true
  rules:
    - if: '$CI_COMMIT_REF_NAME == "main"'
    - if: '$CI_COMMIT_REF_NAME =~ /^release.*$/'
  script:
    - cd tarnished
    - WARFILE=$(find project-app/target -name "*.war" | head -n 1)
    - if [ -z "$WARFILE" ]; then echo "❌ Aucun WAR trouvé !"; exit 1; fi

    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_DEPLOY_USER\",\"password\":\"$CI_DEPLOY_PASSWORD\"}}}" > /kaniko/.docker/config.json

    - |
      echo "FROM jetty:11.0-jre17
      EXPOSE 8080
      ADD $WARFILE /var/lib/jetty/webapps/tarnished.war" > Dockerfile

    - /kaniko/executor --cleanup --context $CI_PROJECT_DIR --destination "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
