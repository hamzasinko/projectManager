image: maven:3-eclipse-temurin-21-alpine

variables:
  MAVEN_CLI_OPTS: "--batch-mode -Dmaven.repo.local=libs"
  CI_REGISTRY: gitlab.cluster.ensisa.uha.fr:4567

cache:
  key: default-cache
  paths:
    - libs
    - "**/target"

stages:
  - build
  - unit-test
  - integration-test
  - deploy

# ============================
# BUILD
# ============================
build:
  stage: build
  script:
    - cd tarnished
    - mvn clean install -DskipTests -DskipITs
  artifacts:
    paths:
      - tarnished/project-app/target/*.war
      - tarnished/project-model/target/*.jar
      - tarnished/project-repomem/target/*.jar

# ============================
# UNIT TESTS
# ============================
unit-test:
  stage: unit-test
  script:
    - cd tarnished
    - mvn test -pl project-model,project-repomem -am
  artifacts:
    reports:
      junit:
        - "**/target/surefire-reports/TEST-*.xml"

# ============================
# INTEGRATION TESTS (Selenium local)
# ============================
integration-test:
  stage: integration-test
  script:
    - cd tarnished
    - mvn $MAVEN_CLI_OPTS clean install -DskipTests
    - mvn $MAVEN_CLI_OPTS -pl project-app jetty:start
        -Djetty.host=0.0.0.0
        -Djetty.port=8080
    - sleep 10
    - curl http://localhost:8080 || exit 1
    - mvn $MAVEN_CLI_OPTS verify

  artifacts:
    reports:
      junit:
        - "tarnished/**/target/failsafe-reports/*.xml"
    expire_in: 1 hour

# ============================
# DOCKER BUILD (KANIKO)
# ============================
deploy-docker:
  stage: deploy
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]

  needs:
    - job: integration-test
      artifacts: true

  rules:
    - if: '$CI_COMMIT_REF_NAME == "main"'
    - if: '$CI_COMMIT_REF_NAME =~ /^release.*$/'

  script:
    - cd tarnished
    - WARFILE=$(find project-app/target -name "*.war" | head -n 1)
    - if [ -z "$WARFILE" ]; then echo "❌ Aucun WAR trouvé"; exit 1; fi

    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_DEPLOY_USER\",\"password\":\"$CI_DEPLOY_PASSWORD\"}}}" > /kaniko/.docker/config.json

    - |
      echo "FROM jetty:11.0-jre17
      EXPOSE 8080
      ADD $WARFILE /var/lib/jetty/webapps/tarnished.war" > Dockerfile

    - /kaniko/executor \
        --cleanup \
        --context $CI_PROJECT_DIR \
        --destination "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"