stages:
  - build
  - deploy

# ============================
# 1️⃣ BUILD
# ============================
build:
  stage: build
  image: maven:3.9.4-eclipse-temurin-17
  script:
    - cd tarnished
    - mvn clean install -DskipITs -DskipTests
  artifacts:
    paths:
      - tarnished/target/*.war

# ============================
# 2️⃣ DEPLOY (Docker via Kaniko)
# ============================
deploy-docker:
  stage: deploy
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  dependencies:
    - build
  script:
    - cd tarnished
    - WARFILE=$(find target -name '*.war' | head -n 1)
    - if [ -z "$WARFILE" ]; then echo "❌ Aucun WAR trouvé !"; exit 1; fi
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - |
      echo "FROM jetty:11.0-jre17
      EXPOSE 8080
      ADD $WARFILE /var/lib/jetty/webapps/tarnished.war" > Dockerfile
    - /kaniko/executor --cleanup --context $CI_PROJECT_DIR --destination "$CI_REGISTRY_IMAGE:latest"
  rules:
    - if: '$CI_COMMIT_REF_NAME == "main"'
    - if: '$CI_COMMIT_REF_NAME =~ /^release.*$/'
