stages:
  - build
  - deploy

build:
  stage: build
  image: maven:3.9.4-eclipse-temurin-17
  variables:
    MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
    DISPLAY: ":99"
    CI: "true"
  cache:
    paths:
      - .m2/repository/
  before_script:
    # Install Chrome and dependencies for Selenium tests
    - apt-get update -qq
    - apt-get install -y wget gnupg2 software-properties-common curl
    # Install Chrome using modern method (apt-key is deprecated)
    - curl -fsSL https://dl-ssl.google.com/linux/linux_signing_key.pub | gpg --dearmor -o /usr/share/keyrings/google-chrome.gpg
    - echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" > /etc/apt/sources.list.d/google-chrome.list
    - apt-get update -qq
    - apt-get install -y google-chrome-stable
    # Install additional dependencies for headless Chrome
    - apt-get install -y xvfb libgbm1 libnss3 libnspr4 libasound2 libatk-bridge2.0-0 libatk1.0-0 libcups2 libdbus-1-3 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 fonts-liberation
    # Start Xvfb for headless display
    - Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
    # Verify Chrome installation
    - google-chrome --version
    - google-chrome --headless --no-sandbox --disable-gpu --version
  script:
    - cd tarnished
    - mvn clean install
  artifacts:
    paths:
      - tarnished/project-app/target/*.war
    reports:
      junit:
        - tarnished/project-app/target/surefire-reports/TEST-*.xml
        - tarnished/project-app/target/failsafe-reports/TEST-*.xml

deploy-docker:
  stage: deploy
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - echo "$CI_DEPLOY_PASSWORD" | docker login -u "$CI_DEPLOY_USER" --password-stdin $CI_REGISTRY
  script:
    - cd tarnished
    - |
      cat > Dockerfile <<EOF
      FROM tomcat:10.1-jdk17
      COPY project-app/target/*.war /usr/local/tomcat/webapps/ROOT.war
      EXPOSE 8090
      CMD ["catalina.sh", "run"]
      EOF
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME .
    - docker tag $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME $CI_REGISTRY_IMAGE:latest
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME
    - docker push $CI_REGISTRY_IMAGE:latest
  only:
    - main
    - /^release\/.*$/
