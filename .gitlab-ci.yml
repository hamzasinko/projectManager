image: maven:3-eclipse-temurin-21-alpine

variables:
  MAVEN_CLI_OPTS: "--batch-mode -Dmaven.repo.local=libs"

cache:
  key: default-cache
  paths:
    - libs
    - "**/target"

stages:
  - build
  - unit-test
  - integration-test
  - deploy

# ============================
# 1️⃣ BUILD
# ============================
build:
  stage: build
  script:
    - cd tarnished
    - mvn clean install -DskipTests -DskipITs
  artifacts:
    paths:
      - project-app/target/*.war
      - project-model/target/*.jar
      - project-repomem/target/*.jar

# ============================
# 2️⃣ UNIT TESTS (Mockito)
# ============================
unit-test:
  stage: unit-test
  script:
    - cd tarnished
    - mvn test -pl project-model,project-repomem -am
  artifacts:
    reports:
      junit:
        - "**/target/surefire-reports/TEST-*.xml"

# ============================
# 3️⃣ INTEGRATION TESTS (Selenium)
# ============================
integration-test:
  stage: integration-test
  image: maven:3-eclipse-temurin-21-alpine
  script:
    - apk add --no-cache chromium chromium-chromedriver
    - export CHROME_BIN="$(command -v chromium-browser || command -v chromium || true)"
    - echo "Using CHROME_BIN=${CHROME_BIN}"
    - cd tarnished
    - mvn $MAVEN_CLI_OPTS clean install -DskipTests
    - mvn $MAVEN_CLI_OPTS verify -f project-app/ -Dsurefire.skip=true -Dselenium.remote.browser=false -Dservlet.port=8080
  artifacts:
    reports:
      junit:
        - "**/target/failsafe-reports/TEST-*.xml"
    paths:
      - "**/target/*.jar"
      - "**/target/*.war"
    expire_in: 1 hour

# ============================
# 4️⃣ DEPLOY (Docker via Kaniko)
# ============================
deploy-docker:
  stage: deploy
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]

  needs:
    - job: build
      artifacts: true

  rules:
    - if: '$CI_COMMIT_REF_NAME == "main"'
    - if: '$CI_COMMIT_REF_NAME =~ /^release.*$/'

  script:
    - WARFILE=$(find tarnished/project-app/target -name "*.war" | head -n 1)
    - if [ -z "$WARFILE" ]; then echo "❌ Aucun WAR trouvé !"; exit 1; fi
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - WARNAME=$(basename $WARFILE)
    - echo -e "FROM jetty:9.4-jre11\nEXPOSE 8080\nADD $WARFILE /var/lib/jetty/webapps/$WARNAME" > Dockerfile
    - /kaniko/executor --cleanup --context $CI_PROJECT_DIR --destination "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME"

# ============================
# 5️⃣ DEPLOY STAGING (Kubernetes)
# ============================
.kubernetes: &kubernetes
  stage: deploy
  image: docker-private.cluster.ensisa.uha.fr/docker/kubectl
  script:
    - kubectl config set-cluster k8s --server="${K8S_SERVER}" --certificate-authority=${K8S_CERTIFICATE_AUTHORITY}
    - kubectl config set-credentials gitlab-ci --token="${K8S_USER_TOKEN}"
    - kubectl config set-context default --cluster=k8s --user=gitlab-ci
    - kubectl config use-context default
    - APP_NAME=$(echo "${CI_PROJECT_NAMESPACE}-${CI_PROJECT_NAME}" | tr '[:upper:]' '[:lower:]')
    - NAMESPACE="gitlab-cd-${ENV}"
    - echo "DYNAMIC_URL=https://${ENV}.cluster.ensisa.uha.fr/tarnished" > deploy.env
    - kubectl -n ${NAMESPACE} create secret docker-registry $APP_NAME-registry-secret --docker-server=${CI_REGISTRY} --docker-username=${CI_DEPLOY_USER} --docker-password=${CI_DEPLOY_PASSWORD} --dry-run=client -o yaml | kubectl -n ${NAMESPACE} apply -f -
    - |
      echo "apiVersion: apps/v1
      kind: Deployment
      metadata:
        labels:
          app: $APP_NAME
        name: $APP_NAME
        namespace: $NAMESPACE
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: $APP_NAME
        template:
          metadata:
            labels:
              app: $APP_NAME
          spec:
            containers:
              - image: \"$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME\"
                imagePullPolicy: Always
                name: $APP_NAME
                env:
                  - name: SERVER_SERVLET_CONTEXT_PATH
                    value: \"/tarnished\"
                  - name: SERVER_PORT
                    value: '8080'
                ports:
                  - name: http
                    containerPort: 8080
            imagePullSecrets:
              - name: $APP_NAME-registry-secret
      ---
      apiVersion: v1
      kind: Service
      metadata:
        name: $APP_NAME-service
        namespace: $NAMESPACE
      spec:
        type: ClusterIP
        selector:
          app: $APP_NAME
        ports:
          - name: http
            protocol: TCP
            port: 80
            targetPort: 8080
      ---
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: $APP_NAME-ingress
        namespace: $NAMESPACE
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
      spec:
        rules:
        - host: ${ENV}.cluster.ensisa.uha.fr
          http:
            paths:
            - path: /tarnished
              pathType: Prefix
              backend:
                service:
                  name: $APP_NAME-service
                  port:
                    number: 80" > app.yml
    - cat app.yml
    - kubectl ${ACTION} -f app.yml
    - kubectl -n $NAMESPACE rollout restart deployment $APP_NAME 2>/dev/null || /bin/true
    - echo "=== ATTENTE DE 10s POUR LE DEMARRAGE ==="
    - sleep 10
    - echo "=== ETAT DES PODS ==="
    - kubectl -n $NAMESPACE get pods
    - echo "=== LOGS DE L'APPLICATION ==="
    - kubectl -n $NAMESPACE logs -l app=$APP_NAME --tail=100 --all-containers=true || echo "Pas de logs disponibles"

  artifacts:
    reports:
      dotenv: deploy.env

deploy-staging:
  <<: *kubernetes
  variables: { ENV: staging, ACTION: apply }
  environment: { name: staging, url: $DYNAMIC_URL }
  rules: [ { if: '$CI_COMMIT_REF_NAME =~ /^release.*$/' } ]
