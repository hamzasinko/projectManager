stages:
  - build
  - selenium-test
  - deploy

build:
  stage: build
  image: maven:3.9.4-eclipse-temurin-17
  script:
    - cd tarnished
    - mvn clean install
  artifacts:
    paths:
      - tarnished/target/*.war

selenium-tests:
  stage: selenium-test
  image: selenium/standalone-chrome:114.0
  dependencies:
    - build
  script:
    - cd tarnished
    - mvn test
  only:
    - release
    - main

deploy-docker:
  stage: deploy
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - cd tarnished
    - WARFILE=$(find target -name '*.war')
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - |
      echo "FROM jetty:11.0-jre17
      EXPOSE 8080
      ADD $WARFILE /var/lib/jetty/webapps/tarnished.war" > Dockerfile
    - /kaniko/executor --cleanup --context $CI_PROJECT_DIR --destination "$CI_REGISTRY_IMAGE:latest"
  only:
    - release
    - main
