<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Stories List</title>
    <link rel="stylesheet" th:href="@{/libs/bootstrap/bootstrap.min.css}">
    <style>
        .status-badge {
            font-size: 0.875rem;
            padding: 0.25rem 0.5rem;
        }
        .status-TODO { background-color: #6c757d; }
        .status-IN_PROGRESS { background-color: #0d6efd; }
        .status-REVIEW { background-color: #ffc107; color: #000; }
        .status-DONE { background-color: #198754; }
        .status-BLOCKED { background-color: #dc3545; }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Stories</h1>
            <a th:href="@{/story/new}" class="btn btn-success" id="newStoryBtn">
                + New Story
            </a>
        </div>
        
        <div id="storiesList">
            <!-- Message si aucune story -->
            <div th:if="${stories.isEmpty()}" class="alert alert-info">
                No stories yet. Create your first story!
            </div>
            
            <!-- Liste des stories -->
            <div class="row">
                <div th:each="story : ${stories}" 
                     class="col-md-6 mb-3"
                     th:id="${'story-' + story.id}">
                    <div class="card">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <h5 class="card-title mb-0" th:text="${story.title}">Story Title</h5>
                                <span class="badge status-badge"
                                      th:classappend="${'status-' + story.status}"
                                      th:text="${story.status}">TODO</span>
                            </div>
                            
                            <p class="card-text text-muted small" 
                               th:text="${story.description != null ? story.description : 'No description'}"
                               style="max-height: 3em; overflow: hidden;">Description</p>
                            
                            <div class="mt-2">
                                <small class="text-muted">
                                    Created: <span th:text="${#dates.format(story.dateCreated, 'dd/MM/yyyy')}">01/01/2025</span>
                                </small>
                            </div>
                            
                            <div class="mt-3">
                                <a th:href="@{'/story/' + ${story.id}}" class="btn btn-primary btn-sm">
                                    View Details
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script th:src="@{/libs/bootstrap/bootstrap.bundle.min.js}"></script>
</body>
</html>
