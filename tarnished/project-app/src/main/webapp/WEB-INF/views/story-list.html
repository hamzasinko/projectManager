<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Stories List</title>
    <link rel="stylesheet" th:href="@{/libs/bootstrap/bootstrap.min.css}">
    <style>
        .status-badge {
            font-size: 0.875rem;
            padding: 0.25rem 0.5rem;
        }
        .status-TODO { background-color: #6c757d; }
        .status-IN_PROGRESS { background-color: #0d6efd; }
        .status-REVIEW { background-color: #ffc107; color: #000; }
        .status-DONE { background-color: #198754; }
        .status-BLOCKED { background-color: #dc3545; }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Stories</h1>
            <a th:href="@{/story/new}" class="btn btn-success" id="newStoryBtn">
                + New Story
            </a>
        </div>
        
        <div id="storiesList">
            <!-- Message si aucune story -->
            <div th:if="${stories.isEmpty()}" class="alert alert-info">
                No stories yet. Create your first story!
            </div>
            
            <!-- Liste des stories -->
            <div class="row">
                <div th:each="story : ${stories}" 
                     class="col-md-6 mb-3"
                     th:id="${'story-' + story.id}">
                    <div class="card">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <h5 class="card-title mb-0" th:text="${story.title}">Story Title</h5>
                                <span class="badge status-badge"
                                      th:classappend="${'status-' + story.status}"
                                      th:text="${story.status}">TODO</span>
                            </div>
                            
                            <p class="card-text text-muted small" 
                               th:text="${story.description != null ? story.description : 'No description'}"
                               style="max-height: 3em; overflow: hidden;">Description</p>
                            
                            <div class="mt-2">
                                <small class="text-muted">
                                    Created: <span th:text="${#dates.format(story.dateCreated, 'dd/MM/yyyy')}">01/01/2025</span>
                                </small>
                            </div>
                            
                            <div class="mt-3">
                                <a th:href="@{'/story/' + ${story.id}}" class="btn btn-primary btn-sm">
                                    Details
                                </a>
                                <a th:href="@{'/story/' + ${story.id} + '/edit'}"
                                   class="btn btn-warning btn-sm">
                                    Edit
                                </a>
                                <button class="btn btn-danger btn-sm"
                                        th:onclick="'showDeleteConfirm(' + ${story.id} + ')'">
                                    Delete
                                </button>
                            </div>
                            
                            <div class="mt-3">
                                <form th:id="'move_story_' + ${story.id}" 
                                      th:action="@{'/stories/' + ${story.id} + '/move'}" 
                                      method="post" 
                                      class="d-inline-block">
                                    <select name="toColumnId" class="form-select form-select-sm d-inline-block" style="width: auto;">
                                        <option value="">Select Column</option>
                                        <option th:each="column : ${columns}" 
                                                th:value="${column.id}" 
                                                th:text="${column.name}">Column</option>
                                    </select>
                                    <button type="submit" class="btn btn-sm btn-info">Move</button>
                                </form>
                            </div>
                            
                            <div class="mt-2">
                                <small class="text-muted">
                                    Time: <span th:text="${story.workLogs != null ? story.workLogs.stream().mapToLong(wl -> wl.duration).sum() : 0}">0</span> min
                                </small>
                            </div>
                            
                            <div class="mt-2">
                                <form th:id="'timer_start_' + ${story.id}" 
                                      th:action="@{'/stories/' + ${story.id} + '/timer/start'}" 
                                      method="post" 
                                      class="d-inline-block">
                                    <button type="submit" class="btn btn-sm btn-success">Start Timer</button>
                                </form>
                                
                                <form th:id="'timer_stop_' + ${story.id}" 
                                      th:action="@{'/stories/' + ${story.id} + '/timer/stop'}" 
                                      method="post" 
                                      class="d-inline-block"
                                      th:if="${story.workLogs != null && !story.workLogs.isEmpty()}">
                                    <input type="hidden" name="workLogId" th:value="${story.workLogs.get(story.workLogs.size() - 1).id}">
                                    <button type="submit" class="btn btn-sm btn-danger">Stop Timer</button>
                                </form>
                            </div>
                        </div>
                    </div>
                    <div th:id="'confirmCard-' + ${story.id}" class="card mt-2" style="display:none;">
                        <div class="card-body">
                            <h6>Do you really want to delete this story?</h6>
                            <div class="mt-2">
                                <form th:action="@{'/story/' + ${story.id} + '/delete'}" method="post">
                                    <button type="submit" class="btn btn-danger btn-sm">Yes, delete</button>
                                </form>
                                <button class="btn btn-secondary btn-sm"
                                        th:onclick="'hideDeleteConfirm(' + ${story.id} + ')'">
                                    No
                                </button>
                            </div>
                        </div>
                    </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        function showDeleteConfirm(id) {
            document.getElementById("confirmCard-" + id).style.display = "block";
        }
        function hideDeleteConfirm(id) {
            document.getElementById("confirmCard-" + id).style.display = "none";
        }
    </script>
    <script th:src="@{/libs/bootstrap/bootstrap.bundle.min.js}"></script>
</body>
</html>
