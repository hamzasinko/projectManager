<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'Kanban Board - ' + ${project.name}">Kanban Board</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/libs/bootstrap/bootstrap.min.css}">
    <style>
        * { font-family: 'Space Grotesk', system-ui, sans-serif !important; }
        .kanban-table {
            width: 100%;
            border-collapse: collapse;
        }
        .kanban-table th, .kanban-table td {
            border: 1px solid #dee2e6;
            padding: 8px;
            vertical-align: top;
        }
        .kanban-table th {
            background-color: #f8f9fa;
            font-weight: bold;
        }
        .swimlane-header {
            font-weight: bold;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            padding: 10px;
            background-color: #f8f9fa;
        }
        .story-card {
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 10px;
            cursor: move;
            transition: box-shadow 0.2s;
        }
        .story-card:hover {
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .project-header {
            background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
            color: white;
            padding: 20px;
            margin-bottom: 0;
        }
        /* Other styles from the original file */
    </style>
</head>
<body>
    <div class="project-header">
        <!-- Header content remains the same -->
    </div>

    <div class="container-fluid mt-3">
        <!-- Add Swimlane Form -->
        <div class="row mb-3">
            <div class="col-md-6">
                <form th:action="@{'/board/' + ${project.id} + '/add-swimlane'}" method="post" class="d-flex gap-2">
                    <input type="text" name="swimlaneName" class="form-control" placeholder="New Swimlane Name" required>
                    <button type="submit" class="btn btn-primary">Add Swimlane</button>
                </form>
            </div>
        </div>

        <div class="kanban-container" id="kanban-container">
            <table class="kanban-table">
                <thead>
                    <tr>
                        <th></th> <!-- Corner -->
                        <th th:each="column : ${columns}" th:text="${column.name}">Column Name</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="swimlane : ${swimlanes}">
                        <td class="swimlane-header" th:text="${swimlane.name}">Swimlane Name</td>
                        <td th:each="column : ${columns}" 
                            th:data-column-id="${column.id}"
                            th:data-swimlane-id="${swimlane.id}"
                            ondrop="drop(event)" 
                            ondragover="allowDrop(event)"
                            ondragleave="dragLeave(event)">
                            
                            <div class="column-stories">
                                <div th:each="story : ${storiesBySwimlaneAndColumn.get(swimlane.id).get(column.id)}"
                                     class="story-card"
                                     th:id="'story-' + ${story.id}"
                                     th:data-story-id="${story.id}"
                                     draggable="true"
                                     ondragstart="drag(event)">
                                     
                                    <div class="story-title" th:text="${story.title}">Story Title</div>
                                    <!-- Story meta and actions -->
                                </div>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modals remain the same -->

    <!-- JavaScript remains largely the same, but might need adjustments for drop targets -->
    <script>
        // Drag and drop functions will need to be checked
        // The drop target is now a 'td' element instead of a 'div.kanban-column'
        // The logic for finding 'toColumnId' in drop(ev) needs to be adapted.
        function drop(ev) {
            console.log('[DROP] Called - draggedStory:', draggedStory);
            if (draggedStory) {
                ev.preventDefault();
                ev.stopPropagation();
                
                const targetCell = ev.currentTarget.closest('td');
                targetCell.classList.remove('drag-over');
                
                const storyId = ev.dataTransfer.getData("storyId");
                const fromColumnId = ev.dataTransfer.getData("fromColumnId");
                const toColumnId = targetCell.dataset.columnId;
                const toSwimlaneId = targetCell.dataset.swimlaneId; // New data attribute

                const movedStoryElement = draggedStory;
                clearInterval(autoScrollInterval);
                draggedStory = null;

                if (!storyId || !fromColumnId || !toColumnId) {
                    console.error('Missing data in drop', {storyId, fromColumnId, toColumnId});
                    if (movedStoryElement) movedStoryElement.style.opacity = '1';
                    alert('Error: Missing story or column ID. Please refresh the page.');
                    return;
                }

                // Update story's swimlaneId on the server
                // This requires a new endpoint or modification to move-story
                
                // For now, just move it visually
                const targetContainer = targetCell.querySelector('.column-stories');
                if (targetContainer) {
                    targetContainer.appendChild(movedStoryElement);
                    movedStoryElement.style.opacity = '1';
                }

                // The 'moveStoryToColumn' function needs to be updated to handle swimlane changes
            }
        }
        // ... other javascript functions
    </script>
</body>
</html>
